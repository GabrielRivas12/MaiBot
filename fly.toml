# fly.toml app configuration file generated for maibot on 2026-11-12T20:12:15Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'maibot'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
